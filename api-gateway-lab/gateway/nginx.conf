worker_processes auto;
events { worker_connections 1024; }

http {
  # Rate limit theo IP: 10 request/giay (offloading)
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
  limit_req_status 429;

  # Phan giai lai ten qua DNS cua Docker moi 5s: container restart thuong doi IP, neu chi
  # phan giai luc khoi dong thi gateway se gui vao IP cu da chet. `resolve` can nginx >= 1.27.3.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream user_svc  { zone user_svc 64k;  server user-service:3000 resolve;  keepalive 32; }
  upstream order_svc { zone order_svc 64k; server order-service:3000 resolve; keepalive 32; }
  upstream bff_svc   { zone bff_svc 64k;   server bff:3000 resolve;           keepalive 32; }

  # Hai server block giong nhau, chi khac limit_req (nginx khong co macro).
  # Path duoc giu nguyen khi proxy (khong strip prefix): /users/... -> user-service /users/...

  server {
    listen 8080;

    # Gateway luon ghi de X-User-Id, nen client khong gia mao duoc.

    # --- Public: dang nhap (khong JWT), van bi rate limit ---
    location = /auth/login {
      limit_req zone=perip burst=5 nodelay;
      proxy_set_header X-User-Id "";
      include /etc/nginx/proxy.conf;
      proxy_pass http://user_svc;
    }

    # --- Noi bo: nginx goi de verify JWT (auth_request) ---
    location = /_auth {
      internal;
      include /etc/nginx/proxy.conf;
      proxy_pass http://bff_svc/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
    }

    location /users/ {
      limit_req zone=perip burst=5 nodelay;
      auth_request /_auth;
      auth_request_set $uid $upstream_http_x_user_id;
      proxy_set_header X-User-Id $uid;
      include /etc/nginx/proxy.conf;
      proxy_pass http://user_svc;
    }

    location /orders {
      limit_req zone=perip burst=5 nodelay;
      auth_request /_auth;
      auth_request_set $uid $upstream_http_x_user_id;
      proxy_set_header X-User-Id $uid;
      include /etc/nginx/proxy.conf;
      proxy_pass http://order_svc;
    }

    location = /dashboard {
      limit_req zone=perip burst=5 nodelay;
      auth_request /_auth;
      auth_request_set $uid $upstream_http_x_user_id;
      proxy_set_header X-User-Id $uid;
      include /etc/nginx/proxy.conf;
      proxy_pass http://bff_svc;
    }
  }

  # Cong 8081: giong het 8080 nhung KHONG rate limit -> de do do tre cong bang.
  server {
    listen 8081;
    location = /auth/login {
      proxy_set_header X-User-Id "";
      include /etc/nginx/proxy.conf;
      proxy_pass http://user_svc;
    }

    location = /_auth {
      internal;
      include /etc/nginx/proxy.conf;
      proxy_pass http://bff_svc/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
    }

    location /users/ {
      auth_request /_auth;
      auth_request_set $uid $upstream_http_x_user_id;
      proxy_set_header X-User-Id $uid;
      include /etc/nginx/proxy.conf;
      proxy_pass http://user_svc;
    }

    location /orders {
      auth_request /_auth;
      auth_request_set $uid $upstream_http_x_user_id;
      proxy_set_header X-User-Id $uid;
      include /etc/nginx/proxy.conf;
      proxy_pass http://order_svc;
    }

    location = /dashboard {
      auth_request /_auth;
      auth_request_set $uid $upstream_http_x_user_id;
      proxy_set_header X-User-Id $uid;
      include /etc/nginx/proxy.conf;
      proxy_pass http://bff_svc;
    }
  }
}
