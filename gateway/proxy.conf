# Phai include trong TUNG location: proxy_set_header khong duoc ke thua tu server
# neu location tu khai bao proxy_set_header rieng (vd X-User-Id).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Upstream chet thi bao loi nhanh thay vi cho mac dinh 60s.
proxy_connect_timeout 2s;
proxy_next_upstream off;
