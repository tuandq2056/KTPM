name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit test tung service (khong can Docker/MinIO).
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [user, order, bff]
    defaults:
      run:
        working-directory: api-gateway-lab/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-gateway-lab/services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: npm test

  # E2E tren stack that: nginx + 3 service + MinIO, gom ca kich ban chaos.
  e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api-gateway-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate compose and scripts
        run: |
          docker compose config -q
          node --check scripts/bench.js

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait until ready
        run: |
          for i in $(seq 1 60); do
            # `|| true`: runner chay bash -e, curl exit 7 khi cong chua mo se giet script truoc khi retry.
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8089/auth/login \
              -H 'Content-Type: application/json' -d '{"username":"alice","password":"alice123"}' || true)
            [ "$code" = 200 ] && echo "ready after ${i}s" && exit 0
            sleep 1
          done
          echo "stack not ready (last http code: $code)"; exit 1

      - name: E2E tests (incl. chaos)
        run: E2E_CHAOS=1 npm run test:e2e

      - name: Latency benchmark
        run: |
          node scripts/bench.js 1500 10 | tee bench.txt
          { echo '### Latency: direct vs gateway'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=60
          # Dua log vao annotation de xem duoc ngay tren trang run (khong can tai log).
          for svc in gateway user-service minio; do
            body=$(docker compose logs --no-color --tail=25 "$svc" 2>&1 | tail -c 2500 \
              | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')
            echo "::error title=logs ${svc}::${body}"
          done

      - name: Tear down
        if: always()
        run: docker compose down -v

  # CD: chi chay khi push len main va TOAN BO test da qua. Day image len GHCR.
  publish:
    needs: [unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [user, order, bff]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ktpm-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: api-gateway-lab/services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
